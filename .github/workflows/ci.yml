name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Build and unit test
        run: |
          cmake -S . -B build
          cmake --build build -j
          ctest --test-dir build --output-on-failure
      - name: Interop with ROS Noetic
        run: tests/interop.sh build

  # GitHub's macOS runners have no docker, so no interop test here.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and unit test
        run: |
          cmake -S . -B build
          cmake --build build -j
          ctest --test-dir build --output-on-failure
